<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>S&H - Gestión de Proyectos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000; }
        .modal-content { background:white; padding:20px; border-radius:8px; width:300px; color:black; }
    </style>
</head>
<body onload="cargarProyectos()">
    <div class="sidebar">
        <img src="logo.png" class="logo-top" alt="Logo S&H">
        <nav>
            <ul>
                <li><a href="index.html">Roles</a></li>
                <li><a href="proyectos.html" style="background:#c04543; color:white;">Proyectos</a></li>
                <li><a href="personal.html">Personal y seguridad social</a></li>
                <li><a href="contabilidad_y_reportes.html">Contabilidad y reportes</a></li>
                <li><a href="inventario.html">Inventario</a></li>
            </ul>
        </nav>
    </div>

    <main class="content">
        <h1>PROYECTOS</h1>

        <div class="form-container">
            <input type="text" id="idObra" placeholder="ID Obra">
            <input type="text" id="nombreP" placeholder="Nombre">
            <input type="text" id="estadoP" placeholder="Estado">
            <input type="text" id="auxiliares" placeholder="Auxiliares">
            <input type="text" id="detalles" placeholder="Descripción">
            <button onclick="agregarProyecto()" class="btn-action">Agregar Proyecto</button>
        </div>

        <table class="table-roles">
            <thead>
                <tr>
                    <th>ID Obra</th><th>Nombre</th><th>Estado</th>
                    <th>Auxiliares</th><th>Descripción</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-proyectos"></tbody>
        </table>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-titulo">Información</h2>
            <p id="modal-info"></p>
            <button onclick="cerrarModal()" class="btn-action">Cerrar</button>
        </div>
    </div>

    <script>
        function cargarProyectos() {
            let proyectos = JSON.parse(localStorage.getItem('proyectos') || "[]");
            let tabla = document.getElementById('tabla-proyectos');
            tabla.innerHTML = "";
            proyectos.forEach((p, index) => {
                let fila = tabla.insertRow();
                fila.innerHTML = `
                    <td class="editable">${p.id}</td>
                    <td class="editable">${p.nom}</td>
                    <td class="editable">${p.est}</td>
                    <td><button class="btn-action" onclick="abrirModal('Auxiliares', '${p.aux}')">Ver</button></td>
                    <td><button class="btn-action" onclick="abrirModal('Detalles', '${p.det}')">Ver</button></td>
                    <td><button class="btn-action" onclick="editarFila(this, ${index})">Actualizar</button></td>
                `;
            });
        }

        function agregarProyecto() {
            let p = {
                id: document.getElementById('idObra').value,
                nom: document.getElementById('nombreP').value,
                est: document.getElementById('estadoP').value,
                aux: document.getElementById('auxiliares').value,
                det: document.getElementById('detalles').value
            };
            if(p.id === "") return;
            let proyectos = JSON.parse(localStorage.getItem('proyectos') || "[]");
            proyectos.push(p);
            localStorage.setItem('proyectos', JSON.stringify(proyectos));
            location.reload();
        }

        function editarFila(btn, index) {
            let fila = btn.parentNode.parentNode;
            let celdas = fila.querySelectorAll(".editable");

            if (btn.innerText === "Actualizar") {
                celdas.forEach(td => td.innerHTML = `<input type="text" value="${td.innerText}" style="width:90%">`);
                btn.innerText = "Guardar";
            } else {
                let proyectos = JSON.parse(localStorage.getItem('proyectos') || "[]");
                proyectos[index] = {
                    id: celdas[0].querySelector("input").value,
                    nom: celdas[1].querySelector("input").value,
                    est: celdas[2].querySelector("input").value,
                    aux: proyectos[index].aux,
                    det: proyectos[index].det
                };
                localStorage.setItem('proyectos', JSON.stringify(proyectos));
                location.reload();
            }
        }

        function abrirModal(titulo, info) {
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-info').innerText = info;
            document.getElementById('modal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
